<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex, follow" />
    <meta name="googlebot" content="noindex, follow" />
    <title>Redirecting — USA vs Canada (salattimeapp.com)</title>
    <script>
(function() {
  var origin = (window.location.origin && window.location.origin.indexOf('localhost') === -1) ? window.location.origin : 'https://salattimeapp.com';
  var raw = window.location.pathname.replace(/^\/(article\/)?|\/$/g, '');
  var target = '/';
  if (raw && raw !== 'index.html' && raw !== '404.html') {
    var mMovie = raw.match(/^(?:movie|movies|film|films|watch)\/(.+)$/i);
    var mSport = raw.match(/^(?:sport|sports|match|football|soccer|live)\/(.+)$/i);
    var mMusic = raw.match(/^(?:music|song|songs|listen|track)\/(.+)$/i);
    if (mMovie) {
      target = '/?page=movies&q=' + encodeURIComponent(mMovie[1].replace(/-/g, ' '));
    } else if (mSport) {
      target = '/?page=sport&q=' + encodeURIComponent(mSport[1].replace(/-/g, ' '));
    } else if (mMusic) {
      target = '/?page=music&q=' + encodeURIComponent(mMusic[1].replace(/-/g, ' '));
    } else {
      target = '/?article=' + encodeURIComponent(raw);
    }
  }
  var link = document.createElement('link');
  link.rel = 'canonical';
  link.href = origin + target;
  document.head.appendChild(link);
  window.__REDIRECT_TARGET__ = target;
  window.location.replace(target);
})();
    </script>
  </head>
  <body style="font-family:system-ui,-apple-system,sans-serif;background:#F8FAFC;color:#0F172A;display:flex;align-items:center;justify-content:center;min-height:100vh;margin:0;padding:24px;text-align:center;">
    <div>
      <h1 style="font-size:20px;font-weight:800;margin:0 0 8px;">Redirecting to USA vs Canada...</h1>
      <p style="font-size:14px;color:#475569;margin:0 0 14px;">This URL has moved to its canonical address.</p>
      <a id="fallback-link" href="/" style="display:inline-block;padding:10px 18px;border-radius:10px;background:#E11D48;color:#FFFFFF;font-weight:700;text-decoration:none;font-size:14px;">Continue to Article</a>
    </div>
    <script>
      var a = document.getElementById('fallback-link');
      if (a && window.__REDIRECT_TARGET__) a.setAttribute('href', window.__REDIRECT_TARGET__);
    </script>
  </body>
</html>
