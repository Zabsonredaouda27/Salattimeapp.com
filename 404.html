<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex, follow" />
    <title>Ipage27 (salattimeapp.com)</title>
    <script>
(function() {
  var raw = window.location.pathname.replace(/^\/+|\/+$/g, '');
  var target = '/';
  if (raw && raw !== 'index.html' && raw !== '404.html') {
    var low = raw.toLowerCase();
    if (low === 'about' || low === 'about-us') target = '/about/';
    else if (low === 'contact' || low === 'contact-us') target = '/contact/';
    else if (low === 'privacy' || low === 'privacy-policy') target = '/privacy-policy/';
    else if (low === 'editorial-standards' || low === 'editorial-policy') target = '/editorial-standards/';
    else if (low === 'author' || low === 'author/daouda-zabsonre') target = '/author/daouda-zabsonre/';
    else if (low.indexOf('article/') === 0) target = '/' + raw + '/';
    else target = '/article/' + encodeURIComponent(raw) + '/';
  }
  window.location.replace(target);
})();
    </script>
  </head>

</html>
