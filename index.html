      <script>
(function() {
  var target = document.getElementById('seo-prerender-main');
  if (!target) return;
  var D = window.__ALL_SEO_ARTICLES__ || {};
  var KEYS = Object.keys(D);
  var init = window.__INITIAL_SEO_ARTICLE__;
  function escHtml(v) {
    return String(v || '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
  }
  if (init && init.data) {
    var d = init.data;
    var cq = init.customQuery ? escHtml(init.customQuery) : '';
    var renderKw = cq || escHtml(d[0]);
    var renderH1 = cq ? (cq + ' — ' + escHtml(d[1])) : escHtml(d[1]);
    var renderDesc = escHtml(d[3]);
    var renderSummary = escHtml(d[4]);
    var renderDate = escHtml((d[5] || '2026-11-19').slice(0, 10));
    var renderCat = escHtml(d[6] || 'Trending News');
    var curIdx = KEYS.indexOf(init.slug);
    if (curIdx === -1) curIdx = 0;
    var neighborLinks = [];
    var nCount = Math.min(18, Math.max(0, KEYS.length - 1));
    for (var i = 1; i <= nCount; i++) {
      var nk = KEYS[(curIdx + i) % KEYS.length];
      neighborLinks.push('<li><a href="/?article=' + encodeURIComponent(nk) + '">' + escHtml(D[nk][0]) + ': ' + escHtml(D[nk][1]) + '</a></li>');
    }
    target.innerHTML =
      '<article>' +
        '<nav aria-label="Breadcrumb"><a href="/">Home</a> &rsaquo; <span>' + renderCat + '</span> &rsaquo; <a href="/?article=' + encodeURIComponent(init.slug) + '">' + renderKw + '</a></nav>' +
        '<h1>' + renderH1 + '</h1>' +
        '<p>' + renderCat + ' · By Daouda Zabsonre · Updated <time datetime="' + escHtml(d[5]) + '">' + renderDate + '</time></p>' +
        '<p>' + renderDesc + '</p>' +
        '<section id="article-executive-summary"><h2>Executive Summary: ' + renderKw + '</h2><p>' + renderSummary + '</p></section>' +
        '<nav aria-label="Related Trending Articles"><h2>Related Trending Stories</h2><ul>' + neighborLinks.join('') + '</ul></nav>' +
      '</article>';
  } else if (KEYS.length > 0) {
    var topLinks = [];
    for (var j = 0; j < Math.min(KEYS.length, 60); j++) {
      var s = KEYS[j];
      topLinks.push('<li><a href="/?article=' + encodeURIComponent(s) + '">' + escHtml(D[s][0]) + ': ' + escHtml(D[s][1]) + '</a></li>');
    }
    target.innerHTML =
      '<h1>Ipage27 — Breaking News, Official Tools &amp; Live Search Trends</h1>' +
      '<p>Instant executive summaries, verified promo codes, official online software guides, and live sports, movie, and music streaming directories. <a href="/sitemap.xml">XML Sitemap</a> · <a href="/rss.xml">RSS Feed</a></p>' +
      '<nav aria-label="Featured Trending Stories"><ul>' + topLinks.join('') + '</ul></nav>';
  }
})();
</script>
